name: Weekly digest

# Once a week: refetch every automatable series, compare what came back with
# the committed data, and email a digest that leads with the findings that
# need a person. Nothing is committed and no PR is opened: the repository is
# brought up to date by hand, when the news warrants it, by the sequence in
# CLAUDE.md ("Bringing the repository up to date").
#
# An earlier version of this workflow opened a refresh PR every week and
# merged it when nothing needed a judgment call. Every week that mattered
# needed one anyway, the README prose pass it depended on ran on a schedule
# that missed GitHub's late cron starts, and a PR left open conflicted with
# the hand edits made the same week, so it now only reports.
#
# The pipeline, one step per tools/weekly_update.py subcommand:
#
#   links    every documented URL; failures are listed in the email
#   fetch    every fetch.py, with AI_DISCOVERY_AS_OF set to today so the
#            fetchers that clip at the snapshot date see this week's rows.
#            A fetcher exiting NEEDS_PERSON (lib/web.py) found upstream news
#            only a person can vendor; it leads the email
#   scan     diff the refetched CSVs against HEAD; tier each change
#            (headline / notable / routine) and chart the series that moved
#   email    the digest, sent even when an earlier step failed
#
# The run's artifact keeps the charts, logs and every refetched CSV, so the
# data in the email can be inspected without refetching.
#
# Secrets and variables (Settings → Secrets and variables → Actions):
#   SCAN_SMTP_USERNAME / SCAN_SMTP_PASSWORD   a Gmail address and an app
#                             password from https://myaccount.google.com/apppasswords
#   SCAN_EMAIL_TO, SCAN_SMTP_HOST, SCAN_SMTP_PORT   optional variables
#
# GitHub disables a schedule after 60 days without repository activity. This
# workflow no longer commits, so a repository left untouched for two months
# stops getting the digest; re-enable it from the Actions tab.

on:
  schedule:
    # Monday 06:00 UTC. GitHub starts scheduled runs late under load (the
    # 2026-10-05 run started at 14:01), which no longer matters: nothing
    # downstream waits on it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-update

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      - name: Today, in UTC, is the date the fetchers clip at
        run: |
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"
          mkdir -p .weekly

      # Link rot is reported in the email, not fatal: it is the one check
      # that can fail for nobody's fault.
      - name: Check documented URLs
        continue-on-error: true
        run: |
          set -o pipefail
          if ! make check-links > .weekly/check-links.log 2>&1; then
            grep -E "returns [0-9]+|unreachable \(" .weekly/check-links.log > .weekly/links.log || tail -n 20 .weekly/check-links.log > .weekly/links.log
            cat .weekly/links.log
            exit 1
          fi

      # Several upstreams rate-limit or go down; the tool records which
      # fetchers failed and exits 0. A CSV a failed fetcher left untouched
      # simply matches HEAD, so nothing false is reported.
      - name: Refetch every automatable series
        env:
          AI_DISCOVERY_AS_OF: ${{ env.TODAY }}
        run: python tools/weekly_update.py fetch

      - name: Diff against the committed data, tier and chart what moved
        id: scan
        run: python tools/weekly_update.py scan

      - name: Keep the refetched CSVs with the run
        if: always()
        run: |
          git diff --name-only -- 'problems/*.csv' > .weekly/changed-csvs.txt || true
          while read -r path; do
            mkdir -p ".weekly/refetched/$(dirname "$path")"
            cp "$path" ".weekly/refetched/$path"
          done < .weekly/changed-csvs.txt
          echo "$(wc -l < .weekly/changed-csvs.txt) CSVs differ from HEAD"

      - name: Keep the charts, logs and data with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-digest
          path: .weekly
          if-no-files-found: ignore
          include-hidden-files: true  # .weekly is a dot-directory
          retention-days: 90

      - name: Email the digest
        if: always()
        env:
          AI_DISCOVERY_AS_OF: ${{ env.TODAY }}
          SCAN_SMTP_HOST: ${{ vars.SCAN_SMTP_HOST || 'smtp.gmail.com' }}
          SCAN_SMTP_PORT: ${{ vars.SCAN_SMTP_PORT || '587' }}
          SCAN_SMTP_USERNAME: ${{ secrets.SCAN_SMTP_USERNAME }}
          SCAN_SMTP_PASSWORD: ${{ secrets.SCAN_SMTP_PASSWORD }}
          SCAN_EMAIL_TO: ${{ vars.SCAN_EMAIL_TO || 'tom.cunningham@gmail.com' }}
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            outcome=failed
          elif [ "${{ steps.scan.outputs.changed }}" = "true" ]; then
            outcome=news
          else
            outcome=unchanged
          fi
          echo "outcome: $outcome"
          UPDATE_OUTCOME="$outcome" python tools/weekly_update.py email
