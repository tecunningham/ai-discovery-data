name: Check data and figures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # This is intentionally the same target contributors run locally. The
      # digest-pinned linux/amd64 image makes PNG bytes independent of the host
      # OS, Python installation and system fonts.
      - run: make check-figures
