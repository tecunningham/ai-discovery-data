name: Daily scan for new results

# Nightly companion to freshness.yml, answering a different question. Freshness
# asks weekly "does the vendored data still match upstream?" and turns red until
# somebody refetches. This job asks "did anything NEW appear upstream since last
# night?" and answers by email: tools/daily_scan.py diffs tonight's fetch
# against the previous night's (kept in the cache below), draws a chart per
# series that moved, and mails the digest. A series that moved once is reported
# once, not every night until the repo catches up.
#
# The fetch runs with AI_DISCOVERY_AS_OF set to today because several fetchers
# clip at lib/dates.py's committed AS_OF_DATE; nothing fetched here is ever
# committed, so the override never reaches a committed artifact.
#
# Email needs two repository secrets (Settings → Secrets and variables →
# Actions): SCAN_SMTP_USERNAME (a Gmail address) and SCAN_SMTP_PASSWORD (an
# app password from https://myaccount.google.com/apppasswords — the account
# password will not work). Another SMTP host can be set with SCAN_SMTP_HOST /
# SCAN_SMTP_PORT. Until the secrets exist, a night with news fails loudly
# rather than dropping it, and the digest is still in the run's step summary
# and the uploaded chart artifact.
#
# GitHub disables a schedule after 60 days without repository activity; if the
# repo goes quiet, re-enable it under Actions or fire workflow_dispatch.

on:
  schedule:
    # 05:30 UTC daily — overnight in the US, and clear of the Monday 06:00
    # freshness run's start.
    - cron: "30 5 * * *"
  workflow_dispatch:
  # TEMPORARY, remove before merge: lets the branch smoke-test the SMTP
  # secrets end to end, since workflow_dispatch only reaches workflows
  # already on the default branch.
  push:
    branches: [claude/daily-domain-scan-email-w9xypr]

permissions:
  contents: read

concurrency:
  group: daily-scan

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      # The previous night's fetched CSVs. Restore-only: the save at the bottom
      # writes a fresh key each night, so restore-keys always finds the newest.
      - name: Restore last night's snapshot
        uses: actions/cache/restore@v4
        with:
          path: .scan-baseline
          key: scan-baseline-${{ github.run_id }}
          restore-keys: scan-baseline-

      - name: Use today as the fetch cutoff
        run: echo "AI_DISCOVERY_AS_OF=$(date -u +%F)" >> "$GITHUB_ENV"

      # Several upstreams rate-limit or go down; a transient failure is not
      # news. A CSV a failed fetcher left untouched simply matches the
      # baseline, so nothing false is reported.
      - name: Refetch every automatable series
        continue-on-error: true
        run: make fetch

      - name: Diff against last night, chart and email what is new
        env:
          SCAN_SMTP_HOST: ${{ vars.SCAN_SMTP_HOST || 'smtp.gmail.com' }}
          SCAN_SMTP_PORT: ${{ vars.SCAN_SMTP_PORT || '587' }}
          SCAN_SMTP_USERNAME: ${{ secrets.SCAN_SMTP_USERNAME }}
          SCAN_SMTP_PASSWORD: ${{ secrets.SCAN_SMTP_PASSWORD }}
          SCAN_EMAIL_TO: ${{ vars.SCAN_EMAIL_TO || 'tom.cunningham@gmail.com' }}
        run: python tools/daily_scan.py --baseline .scan-baseline --charts scan-charts --email

      - name: Keep the charts with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-charts
          path: scan-charts
          if-no-files-found: ignore
          retention-days: 14

      # Saved only when the job succeeded: a failed email leaves the old
      # baseline in place, so tomorrow's run reports the same news again
      # instead of losing it.
      - name: Save tonight's snapshot as the next baseline
        uses: actions/cache/save@v4
        with:
          path: .scan-baseline
          key: scan-baseline-${{ github.run_id }}
